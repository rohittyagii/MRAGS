repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.1.246
    hooks:
      - id: ruff
        args: ["check", "--fix"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
