[project]
name = "mrags"
version = "0.1.0"
description = "Enterprise multimodal RAG system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "MRAGS" }
]
dependencies = [
  "pydantic>=2.7.0",
  "unstructured[local-inference]>=0.15.0",
  "pdf2image>=1.17.0",
  "pillow>=10.0.0",
  "faiss-cpu>=1.8.0",
  "numpy>=1.26.0",
  "aiohttp>=3.9.0",
  "openai>=1.30.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "tiktoken>=0.7.0",
  "pandas>=2.2.0",
  "beautifulsoup4>=4.12.0",
  "sentence-transformers>=3.0.0",
  "llama-cpp-python>=0.3.5"
]

[project.scripts]
mrags = "mrags.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
