name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Use supported stable Python versions available on GitHub-hosted runners.
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda (mamba)
        uses: conda-incubator/setup-miniconda@v2
        with:
          python-version: ${{ matrix.python-version }}
          use-mamba: true
          auto-update-conda: false
          environment-name: ci
          activate-environment: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements-ci.txt') }}

      - name: Install faiss-cpu via mamba (conda-forge)
        run: |
          mamba install -y -c conda-forge faiss-cpu

      - name: Debug: show Python & conda env
        run: |
          python --version
          which python || which python3 || true
          python -c 'import sys,importlib; print(sys.executable, importlib.util.find_spec("faiss") is not None)'
          conda info --envs
          mamba list faiss-cpu || true

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff build pytest
          # Install the package in editable mode but do NOT install dependencies here.
          # This prevents heavy optional packages (llama-cpp-python, sentence-transformers)
          # from being built during CI. Install only the minimal runtime/test deps below.
          pip install -e . --no-deps
          pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Build sdist & wheel
        run: |
          python -m build
