name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12, 3.14]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff build pytest
          # Install the package in editable mode but do NOT install dependencies here.
          # This prevents heavy optional packages (llama-cpp-python, sentence-transformers)
          # from being built during CI. Install only the minimal runtime/test deps below.
          pip install -e . --no-deps
          pip install numpy faiss-cpu

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Build sdist & wheel
        run: |
          python -m build
